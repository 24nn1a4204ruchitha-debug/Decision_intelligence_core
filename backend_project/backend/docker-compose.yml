version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: decision_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: decision_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: decision_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/decision_system
      SECRET_KEY: antigravity-production-key-2026
      DEBUG: "True"
      APP_ENV: production
      ANOMALY_CONTAMINATION: "0.1"
      CONFIDENCE_THRESHOLD_AUTONOMOUS: "0.75"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
